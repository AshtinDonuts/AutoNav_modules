nav2_map_server:
  ros__parameters:
    yaml_filename: "empty_map.yaml"
    use_sim_time: false

costmap:
  costmap:
    ros__parameters:
      update_frequency: 10.0
      publish_frequency: 4.0
      global_frame: odom
      robot_base_frame: base_link
      use_sim_time: false
      rolling_window: true
      width: 200
      height: 200
      resolution: 0.05
      plugins: ["voxel_layer", "inflation_layer"]
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True
        publish_voxel_map: True
        origin_z: -0.5            # Start height for voxel grid (meters). Set to -0.5 to include points below sensor frame.
        z_resolution: 0.05        # Z-axis resolution (vertical discretization: 0.05m per layer)
        z_voxels: 16              # Number of voxel layers (total height range: 16 * 0.05m = 0.8m)
        max_obstacle_height: 2.0   # Points above 2.0m are ignored as noise; height-based filtering
        mark_threshold: 0
        observation_sources: synthetic_pointcloud
        synthetic_pointcloud:
          # Subscribes to synthetic pointcloud for testing
          topic: /synthetic/points
          # Topic provides PointCloud2 from synthetic generator; used as obstacle observations for voxel layer
          max_obstacle_height: 2.0
          clearing: True                    # Enable raytracing to clear old obstacles (free-space clearing)
          marking: True                      # Mark obstacles from this observation source
          data_type: "PointCloud2"         # Message type published on topic
          reliability: "reliable"
          durability: "volatile"
          observation_persistence: 0.5      # Time (seconds) to keep obstacle observations before they decay
                                            # Shorter persistence lets obstacles disappear faster when not re-observed
          raytrace_range: 5.0               # Max range for raycasting to clear free space (meters)
          obstacle_range: 5.0               # Max range to mark obstacles; points beyond this range are ignored
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.5

  local_costmap:
    ros__parameters:
      update_frequency: 10.0
      publish_frequency: 4.0
      global_frame: odom
      robot_base_frame: base_link
      use_sim_time: false
      rolling_window: true
      width: 20
      height: 20
      resolution: 0.05
      plugins: ["voxel_layer", "inflation_layer"]
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True
        publish_voxel_map: True
        origin_z: -0.5            # Start height for voxel grid (meters). Set to -0.5 to include points below sensor frame.
        z_resolution: 0.05        # Z-axis resolution (vertical discretization: 0.05m per layer)
        z_voxels: 16              # Number of voxel layers (total height range: 16 * 0.05m = 0.8m, which is -0.5 to +0.3m)
        max_obstacle_height: 2.0   # Points above 2.0m are ignored as noise; height-based filtering
        mark_threshold: 0
        observation_sources: synthetic_pointcloud
        synthetic_pointcloud:
          topic: /synthetic/points
          # Topic provides PointCloud2 from synthetic generator; used as obstacle observations for voxel layer
          max_obstacle_height: 2.0
          clearing: True                    # Enable raytracing to clear old obstacles (free-space clearing)
          marking: True                     # Mark obstacles from this observation source
          data_type: "PointCloud2"         
          observation_persistence: 0.5      # Time (seconds) to keep obstacle observations before they decay
                                            # Shorter persistence lets obstacles disappear faster when not re-observed
          raytrace_range: 5.0               # Max range for raycasting to clear free space (meters)
          obstacle_range: 5.0               # Max range to mark obstacles; points beyond this range are ignored
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.5

  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      use_sim_time: false
      plugins: ["static_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.5

nav2_lifecycle_manager:
  ros__parameters:
    node_names: ["map_server", "costmap_2d"]
    autostart: true
