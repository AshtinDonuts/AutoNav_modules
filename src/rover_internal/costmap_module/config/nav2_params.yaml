nav2_map_server:
  ros__parameters:
    yaml_filename: "empty_map.yaml"
    use_sim_time: false

costmap:
  costmap:
    ros__parameters:
      update_frequency: 10.0
      publish_frequency: 4.0
      global_frame: odom
      robot_base_frame: base_link
      use_sim_time: false
      rolling_window: true
      width: 200
      height: 200
      resolution: 0.05
      plugins: ["voxel_layer", "inflation_layer"]
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True
        publish_voxel_map: True
        origin_z: 0.0
        z_resolution: 0.05        # Z-axis resolution (vertical discretization: 0.05m per layer)
        z_voxels: 16              # Number of voxel layers (total height range: 16 * 0.05m = 0.8m)
        max_obstacle_height: 2.0   # Points above 2.0m are ignored as noise; height-based filtering
        mark_threshold: 0
        observation_sources: zed_pointcloud
        zed_pointcloud:
          topic: /zed/points
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "PointCloud2"
          reliability: "reliable"
          durability: "volatile"
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.5

  local_costmap:
    ros__parameters:
      update_frequency: 10.0
      publish_frequency: 4.0
      global_frame: odom
      robot_base_frame: base_link
      use_sim_time: false
      rolling_window: true
      width: 20
      height: 20
      resolution: 0.05
      plugins: ["voxel_layer", "inflation_layer"]
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True
        publish_voxel_map: True
        origin_z: 0.0
        z_resolution: 0.05        # Z-axis resolution (vertical discretization: 0.05m per layer)
        z_voxels: 16              # Number of voxel layers (total height range: 16 * 0.05m = 0.8m)
        max_obstacle_height: 2.0   # Points above 2.0m are ignored as noise; height-based filtering
        mark_threshold: 0
        observation_sources: zed_pointcloud
        zed_pointcloud:
          topic: /zed/points
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "PointCloud2"
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.5

  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      use_sim_time: false
      plugins: ["static_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.5

nav2_lifecycle_manager:
  ros__parameters:
    node_names: ["map_server", "costmap_2d"]
    autostart: true
